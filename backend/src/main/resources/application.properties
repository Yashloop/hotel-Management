# =====================================================
#  HOTEL BOOKING APPLICATION - Configuration
#  HCLTech Hackathon 2026
# =====================================================

# Server Configuration
server.port=8080

# ==================== Database Configuration ====================
# --- 1. Aiven MySQL Cloud Database (ACTIVE) ---
spring.datasource.url=jdbc:mysql://mysql-3ad9c4fb-yashbala9688-f5b9.a.aivencloud.com:22729/hackathon?useSSL=true&requireSSL=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------------------
# --- 2. H2 In-Memory Database (BACKUP/FALLBACK) ---
# If Aiven MySQL fails, comment out section 1 and uncomment this section
# ----------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
