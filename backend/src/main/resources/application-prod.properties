# =====================================================
#  PROD PROFILE - Aiven MySQL Cloud Database
# =====================================================
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# Or in IntelliJ: Edit Run Config → Active Profiles: prod

# Aiven MySQL Cloud Database
spring.datasource.url=jdbc:mysql://mysql-3ad9c4fb-yashbala9688-f5b9.a.aivencloud.com:22729/hackathon?useSSL=true&requireSSL=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
